<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>선샤인 고아원 — 공포 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--ink:#d8cbb8;--dim:#8a7d6d;--blood:#9b1c1c;--glow:#ffd9a0;--panel:#120e0b;--line:#3a2c22}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#000;color:var(--ink);font-family:"Noto Serif KR","Batang",serif;min-height:100vh}
  body{display:flex;justify-content:center;padding:10px}
  #app{width:100%;max-width:980px}
  button{font:inherit;cursor:pointer;background:#1c1510;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 14px}
  button:hover:not(:disabled){border-color:#a07a4a;color:#fff}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:#7a1616;border-color:#a02525;color:#fff;font-weight:bold}
  button.primary:hover{background:#9b1c1c}
  input[type=text]{font:inherit;background:#050403;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;width:200px;text-align:center;letter-spacing:4px}
  #hud{display:flex;align-items:center;gap:12px;padding:4px 2px 8px;font-size:14px;color:var(--dim)}
  #roomName{flex:1;color:var(--ink);letter-spacing:1px}
  #fearBox{display:flex;align-items:center;gap:6px;font-size:12px}
  #fear{width:110px;height:8px;background:#1a1210;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  #fear i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6b1010,#e03030);transition:width .6s}
  #timer{color:#c9a26a;font-variant-numeric:tabular-nums}

  #stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:1px solid #2a1f18;border-radius:6px;box-shadow:0 0 40px rgba(120,20,20,.18);cursor:crosshair;touch-action:none;user-select:none}
  #scene{position:absolute;inset:0;width:100%;height:100%}
  .hot{fill:transparent;cursor:pointer}
  .hot:hover{fill:rgba(255,220,150,.08);stroke:rgba(255,220,150,.55);stroke-width:1.5}
  #dark{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,230,180,.10) 0,transparent var(--r3,260px)),
      radial-gradient(circle at var(--mx,50%) var(--my,50%),transparent 0,transparent var(--r1,55px),rgba(0,0,0,.55) var(--r2,150px),rgba(0,0,0,.95) var(--r3,270px));
    animation:flick 7s infinite}
  @keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.86}43%{opacity:1}44%{opacity:.8}45%{opacity:1}78%{opacity:1}79%{opacity:.9}80%{opacity:1}}
  #vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(0,0,0,.9)}
  #grain{position:absolute;inset:-50%;pointer-events:none;opacity:.09;mix-blend-mode:screen;animation:gr .5s steps(5) infinite;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
  @keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,3%)}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
  #redtint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(130,0,0,.5));opacity:0;transition:opacity 1s}
  #tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.75);border:1px solid #6b5338;color:#f1dfc2;font-size:12px;padding:3px 8px;border-radius:4px;opacity:0;transform:translate(10px,-30px);white-space:nowrap}

  #ghost{position:absolute;bottom:6%;height:58%;pointer-events:none;opacity:0;transition:left 2s ease-in-out,opacity .8s,height 2s;filter:blur(.6px) drop-shadow(0 0 14px rgba(200,220,255,.35))}
  #ghost svg{height:100%;width:auto;animation:sway 4s ease-in-out infinite}
  @keyframes sway{50%{transform:translateX(5px) skewX(-1.5deg)}}
  #ghost.blink{animation:gblink .35s steps(2) 3}
  @keyframes gblink{50%{opacity:0}}

  #scare{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:30}
  #scare.on{display:flex;animation:shk .08s linear infinite}
  #scare svg{height:105%;filter:contrast(1.4)}
  @keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-6px)}75%{transform:translate(-5px,-5px)}}
  .shake{animation:shk .12s linear 3}

  #narr{min-height:64px;margin:10px 0 8px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blood);border-radius:6px;line-height:1.65;font-size:15px;color:#e8dccb}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #inv{display:flex;gap:6px;flex:1;min-height:42px;align-items:center;flex-wrap:wrap}
  .item{background:#1a130e;border:1px solid #7a5a35;border-radius:8px;padding:4px 10px;font-size:13px;animation:in .5s}
  .item b{font-size:20px;margin-right:4px;vertical-align:middle}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
  #modal.on{display:flex}
  #box{width:100%;max-width:620px;max-height:93vh;overflow:auto;background:linear-gradient(#17100b,#0d0907);border:1px solid #6b5338;border-radius:10px;padding:20px;box-shadow:0 0 60px rgba(0,0,0,.9)}
  #box h2{margin:0 0 8px;font-size:20px;color:#f1dfc2;letter-spacing:1px}
  .clue{background:#080605;border-left:3px solid #a07a4a;padding:10px 14px;margin:10px 0;border-radius:3px;line-height:1.7;font-size:15px;color:#e6d8c3}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #msg{min-height:22px;font-weight:bold;margin:8px 0 4px}
  .ok{color:#6fcf97}.bad{color:#ff6b6b}.cen{text-align:center}
  #seqShow{min-height:30px;margin:10px 0;font-size:20px;letter-spacing:3px}
  .cb{width:54px;height:54px;border-radius:8px;border:2px solid rgba(255,255,255,.15);font-size:0}
  .cb.round{border-radius:50%}
  .note{width:52px;height:64px;font-size:15px;background:#e9e0cf;color:#222;border-radius:4px 4px 8px 8px;border:1px solid #999}
  .note:hover:not(:disabled){background:#fff;color:#000}
  .diffwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .diffwrap svg{width:calc(50% - 4px);min-width:240px;border:2px solid #3a2c22;border-radius:4px;cursor:crosshair;filter:sepia(.75) contrast(1.1) brightness(.9)}
  .cap{font-size:12px;color:var(--dim);text-align:center;margin:4px 0}
  #notesList{padding-left:20px;font-size:14px;line-height:1.7;color:#cbbda8}

  #intro,#end{position:fixed;inset:0;background:radial-gradient(#1a0f0b,#000 70%);z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  #end{display:none;z-index:90}
  .title{font-size:clamp(34px,7vw,64px);font-weight:700;letter-spacing:6px;color:#c93a3a;text-shadow:0 0 18px rgba(200,40,40,.6);animation:tflick 5s infinite;margin:0 0 6px}
  @keyframes tflick{0%,92%,100%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
  .sub{color:var(--dim);letter-spacing:3px;margin-bottom:26px}

  /* ===== 모바일 / 세로 화면 ===== */
  .pan{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:84px;z-index:5;background:rgba(0,0,0,.45);border:1px solid rgba(255,220,150,.35);color:#f1dfc2;font-size:22px;padding:0;display:none;align-items:center;justify-content:center;touch-action:manipulation}
  #panL{left:0;border-radius:0 12px 12px 0}
  #panR{right:0;border-radius:12px 0 0 12px}
  .pan.dis{opacity:.15;pointer-events:none}
  .pan.on{display:flex;animation:panpulse 2s ease-in-out 3}
  @keyframes panpulse{50%{background:rgba(255,200,120,.35)}}
  button{touch-action:manipulation}
  @media (orientation:portrait){
    body{padding:6px}
    #stage{aspect-ratio:3/4}
    #hud{gap:8px;font-size:13px;padding:2px 0 6px}
    #fear{width:70px}
    #fearBox{font-size:11px}
    #narr{font-size:14px;padding:10px 12px;margin:8px 0 6px;min-height:84px}
    #bar{gap:6px}
    .item{font-size:12px;padding:3px 8px}
    #box{padding:16px;max-height:92dvh}
    #box h2{font-size:18px}
    button{min-height:44px}
    .cb{width:56px;height:56px}
    .note{width:42px;height:66px;font-size:14px}
    .diffwrap svg{width:100%}
    input[type=text]{font-size:18px;width:170px;min-height:46px}
    #hud button{min-height:38px;padding:6px 10px}
  }
  @media (max-width:420px){ #roomName{font-size:13px} .note{width:38px} }
  .tapnote{display:none}
  @media (hover:none){ .tapnote{display:inline} .hot:hover{fill:transparent;stroke:none} }
  .warn{color:#8a7d6d;font-size:13px;line-height:1.8;margin:18px 0 22px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="roomName">—</span>
    <span id="fearBox">공포 <span id="fear"><i></i></span></span>
    <span id="timer">00:00</span>
    <button id="muteBtn" title="소리">🔊</button>
    <button id="notesBtn" title="수첩">📒</button>
  </div>
  <div id="stage">
    <svg id="scene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"></svg>
    <div id="ghost"></div>
    <div id="dark"></div>
    <div id="redtint"></div>
    <div id="vig"></div>
    <div id="grain"></div>
    <div id="flash"></div>
    <div id="tip"></div>
    <button class="pan" id="panL" aria-label="왼쪽으로">◀</button>
    <button class="pan" id="panR" aria-label="오른쪽으로">▶</button>
    <div id="scare"></div>
  </div>
  <div id="narr"></div>
  <div id="bar"><div id="inv"></div></div>
</div>

<div id="modal"><div id="box"></div></div>

<div id="intro"><div>
  <h1 class="title">선샤인 고아원</h1>
  <div class="sub">1987 — 폐쇄된 그날 이후</div>
  <p style="line-height:1.9;max-width:520px;margin:0 auto;color:#cbbda8">
    실종 사건을 취재하러 온 폐고아원. 현관문이 등 뒤에서 잠겼다.<br>
    정전된 어둠 속, 손전등 하나뿐.<br>
    누군가 <b style="color:#c93a3a">나를 지켜보고 있다.</b>
  </p>
  <p class="warn">🔦 마우스(또는 손가락)를 움직여 어둠을 비추세요.<br>
    📱 휴대폰은 세로로 들고, 화면 양옆의 ◀ ▶ 버튼으로 방을 둘러보세요.<br>
    🔊 소리를 켜고, 조용한 곳에서 플레이하세요.<br>
    ⚠️ 놀라는 장면이 있습니다. 틀릴수록 '그것'이 가까이 다가옵니다.<br>
    💡 힌트는 한 문제에서 5번 틀려야 볼 수 있습니다.</p>
  <button class="primary" id="startBtn" style="padding:12px 34px;font-size:17px">안으로 들어간다</button>
</div></div>
<div id="end"><div id="endBody"></div></div>

<script>
const $=s=>document.querySelector(s);
const NEED_WRONG=5, MAX_FEAR=10;

/* ===================== 오디오 ===================== */
let AC,master,muted=false;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.85; master.connect(AC.destination);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o1.type=o2.type='sawtooth'; o1.frequency.value=46; o2.frequency.value=46.8;
  f.type='lowpass'; f.frequency.value=170; g.gain.value=.08;
  l.frequency.value=.11; lg.gain.value=80; l.connect(lg); lg.connect(f.frequency);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  [o1,o2,l].forEach(o=>o.start());
  beatLoop();
}
function tone(freq,dur=.4,type='sine',vol=.12,delay=0,slideTo){
  if(!AC) return; const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur=.5,vol=.1,freq=800,type='lowpass',swell=false,delay=0){
  if(!AC) return; const t=AC.currentTime+delay,n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type=type; f.frequency.value=freq;
  g.gain.setValueAtTime(swell?.001:vol,t); if(swell) g.gain.linearRampToValueAtTime(vol,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const sfx={
  click(){tone(900,.05,'square',.03)},
  creak(){tone(110,.9,'sawtooth',.06,0,70); tone(160,.9,'sawtooth',.03,0,95); noise(.8,.04,500,'bandpass')},
  good(){[523,659,784,1046].forEach((f,i)=>tone(f,1.1,'sine',.09,i*.12))},
  bad(){tone(90,.5,'sawtooth',.12,0,50); tone(95,.5,'square',.06,0,55); noise(1.3,.09,1500,'bandpass',true)},
  scare(){noise(.9,.5,3000,'highpass'); tone(900,.8,'sawtooth',.3,0,200); tone(1300,.8,'square',.15,0,260); tone(40,1,'sine',.5)},
  thump(){tone(60,.16,'sine',.35,0,40); tone(55,.18,'sine',.28,.18,38)},
  item(){tone(660,.3,'triangle',.1); tone(990,.5,'triangle',.08,.1)},
  note(i){const F=[261.6,293.7,329.6,349.2,392,440,493.9];tone(F[i],1.3,'sine',.14); tone(F[i]*2,.9,'sine',.04)}
};
function beatLoop(){
  if(!muted&&S.fear>0&&S.started) sfx.thump();
  setTimeout(beatLoop,1400-S.fear*95);
}

/* ===================== 상태 ===================== */
const S={room:'hall',items:new Set(),solved:new Set(),notes:[],wrongs:{},fear:0,hints:0,totalWrong:0,t0:0,started:false,over:false,scared:new Set(),timer:null};
const ITEM={
  kidKey:{i:'🗝️',n:'어린이방 열쇠'}, eye:{i:'👁️',n:'유리 눈'}, spring:{i:'⚙️',n:'태엽'},
  cellarKey:{i:'🔑',n:'지하실 열쇠'}, body:{i:'🧸',n:'낡은 인형 몸통'}, doll:{i:'🪆',n:'완성된 인형'}
};

/* ===================== 그림(SVG) ===================== */
const DEFS=`<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2c27"/><stop offset="1" stop-color="#17140f"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1d12"/><stop offset="1" stop-color="#0e0805"/></linearGradient>
  <linearGradient id="kwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3226"/><stop offset="1" stop-color="#201a13"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25272a"/><stop offset="1" stop-color="#0f1011"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b5258"/><stop offset=".5" stop-color="#6d767d"/><stop offset="1" stop-color="#3b4146"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3322"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
  <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bcd7ff" stop-opacity=".5"/><stop offset="1" stop-color="#bcd7ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="cglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".7"/><stop offset="1" stop-color="#ff8c00" stop-opacity="0"/></radialGradient>
  <pattern id="wp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#3a3024"/><rect width="20" height="40" fill="#352b20"/><circle cx="10" cy="12" r="2" fill="#4e4130"/><circle cx="30" cy="28" r="2" fill="#4e4130"/></pattern>
</defs>`;
const cobweb=(x,y,s=1,f=1)=>`<g stroke="#9aa" stroke-opacity=".25" fill="none" transform="translate(${x},${y}) scale(${f*s},${s})"><path d="M0 0 L60 0 M0 0 L0 60 M0 0 L45 45 M18 0 Q18 18 0 18 M34 0 Q34 34 0 34 M52 0 Q52 52 0 52"/></g>`;
function hand(cx,cy,len,deg,w,col){const a=deg*Math.PI/180;return `<line x1="${cx}" y1="${cy}" x2="${cx+len*Math.sin(a)}" y2="${cy-len*Math.cos(a)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`}
function floorLines(y0){let s='';for(let i=1;i<8;i++){const y=y0+i*i*2.3+i*5;s+=`<line x1="0" y1="${y}" x2="960" y2="${y}" stroke="#000" stroke-opacity=".4"/>`}
  for(let x=-300;x<1300;x+=120) s+=`<line x1="${480+(x-480)*.45}" y1="${y0}" x2="${x}" y2="540" stroke="#000" stroke-opacity=".35"/>`;return s}

function artHall(){
  let s=`<rect width="960" height="390" fill="url(#wall)"/><rect y="262" width="960" height="128" fill="#1d1914"/>`;
  for(let x=0;x<960;x+=60) s+=`<line x1="${x}" y1="262" x2="${x}" y2="390" stroke="#0a0806" stroke-width="2"/>`;
  s+=`<rect y="256" width="960" height="8" fill="#31281f"/><ellipse cx="640" cy="50" rx="110" ry="40" fill="#000" opacity=".28"/>`;
  s+=`<rect y="390" width="960" height="150" fill="url(#floor)"/>`+floorLines(390);
  // 창문
  s+=`<circle cx="215" cy="150" r="150" fill="url(#moon)"/><rect x="150" y="70" width="130" height="170" fill="#0b1520" stroke="#3b2f22" stroke-width="9"/>
      <line x1="215" y1="70" x2="215" y2="240" stroke="#3b2f22" stroke-width="6"/><line x1="150" y1="155" x2="280" y2="155" stroke="#3b2f22" stroke-width="6"/>
      <polygon points="170,390 270,390 340,540 110,540" fill="#a9c4ff" opacity=".07"/>
      <path d="M150 70 Q165 140 150 240 L130 240 L130 70Z" fill="#2a1d1d" opacity=".9"/>`;
  // 왼쪽 문
  s+=`<rect x="14" y="156" width="88" height="236" fill="url(#wood)" stroke="#120b07" stroke-width="5"/><rect x="26" y="172" width="64" height="90" fill="none" stroke="#120b07" stroke-width="3"/><rect x="26" y="276" width="64" height="100" fill="none" stroke="#120b07" stroke-width="3"/>
      <circle cx="88" cy="285" r="5" fill="#a08038"/><rect x="34" y="130" width="48" height="18" fill="#2a2018" stroke="#6b5338"/><text x="58" y="143" font-size="10" fill="#cdb98f" text-anchor="middle">어린이방</text>`;
  // 시계

/* ===================== UI 헬퍼 ===================== */
const stage=$('#stage'), tip=$('#tip');
let typeT;
function narrate(t){
  clearInterval(typeT); const el=$('#narr'); let i=0; el.innerHTML='';
  const plain=t; const tmp=document.createElement('div'); tmp.innerHTML=t; const text=tmp.textContent;
  if(text.length!==t.length){ el.innerHTML=t; return; }
  typeT=setInterval(()=>{ el.textContent=plain.slice(0,++i); if(i>=plain.length) clearInterval(typeT); },22);
}
/* ---- 화면 크기 / 좌우 이동 (모바일 세로) ---- */
let panX=0,VW=960,panAnim;
function applyVB(){
  $('#scene').setAttribute('viewBox',`${panX} 0 ${VW} 540`);
  const wide=VW<950;
  ['#panL','#panR'].forEach(s=>$(s).classList.toggle('on',wide));
  $('#panL').classList.toggle('dis',panX<=1);
  $('#panR').classList.toggle('dis',panX>=960-VW-1);
}
function layout(center){
  const r=stage.getBoundingClientRect();
  VW=Math.min(960,540*r.width/Math.max(r.height,1));
  panX=center?(960-VW)/2:Math.max(0,Math.min(960-VW,panX));
  const small=r.width<700;
  const v=small?[44,108,190]:[55,150,270];
  stage.style.setProperty('--r1',v[0]+'px'); stage.style.setProperty('--r2',v[1]+'px'); stage.style.setProperty('--r3',v[2]+'px');
  $('#dark').style.setProperty('--r1',v[0]+'px'); $('#dark').style.setProperty('--r2',v[1]+'px'); $('#dark').style.setProperty('--r3',v[2]+'px');
  applyVB();
}
function panTo(x){
  x=Math.max(0,Math.min(960-VW,x)); const from=panX,t0=performance.now();
  cancelAnimationFrame(panAnim);
  const step=t=>{const k=Math.min(1,(t-t0)/320),e=1-Math.pow(1-k,3);panX=from+(x-from)*e;applyVB();if(k<1)panAnim=requestAnimationFrame(step)};
  panAnim=requestAnimationFrame(step);
}
$('#panL').onclick=e=>{e.stopPropagation();sfx.click();panTo(panX-VW*.65)};
$('#panR').onclick=e=>{e.stopPropagation();sfx.click();panTo(panX+VW*.65)};
['#panL','#panR'].forEach(s=>$(s).addEventListener('pointerdown',e=>e.stopPropagation()));
window.addEventListener('resize',()=>layout(false));
window.addEventListener('orientationchange',()=>setTimeout(()=>layout(true),250));

function setHot(reset){
  const r=ROOMS[S.room];
  if(reset) layout(true);
  $('#roomName').textContent=r.name;
  $('#scene').innerHTML=DEFS+r.art()+r.hot.map(h=>`<rect class="hot" data-id="${h.id}" data-l="${h.label}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="6"/>`).join('');
  $('#scene').querySelectorAll('.hot').forEach(el=>{
    el.addEventListener('click',()=>{ if(S.over) return; sfx.click(); r.hot.find(h=>h.id===el.dataset.id).act(); });
    el.addEventListener('pointerenter',()=>{tip.textContent=el.dataset.l;tip.style.opacity=1});
    el.addEventListener('pointerleave',()=>{tip.style.opacity=0});
  });
}
function renderInv(){
  $('#inv').innerHTML=[...S.items].map(k=>`<span class="item"><b>${ITEM[k].i}</b>${ITEM[k].n}</span>`).join('')||'<span style="color:var(--dim);font-size:13px">가진 물건 없음</span>';
}
function updateFear(){
  $('#fear i').style.width=(S.fear/MAX_FEAR*100)+'%';
  $('#redtint').style.opacity=Math.min(1,S.fear/MAX_FEAR*1.1);
  const g=$('#ghost');
  if(S.fear<2){g.style.opacity=0;return;}
  g.innerHTML=GHOST_SVG;
  const pos=[[8,'22%'],[18,'30%'],[28,'38%'],[40,'46%'],[52,'54%'],[62,'60%'],[70,'66%'],[76,'72%'],[80,'80%'],[84,'88%']][Math.min(S.fear,10)-1];
  g.style.left=pos[0]+'%'; g.style.height=pos[1]; g.style.opacity=Math.min(.75,.15+S.fear*.07);
  g.classList.remove('blink'); void g.offsetWidth; g.classList.add('blink');
}
function openModal(html){ $('#box').innerHTML=html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function clue(title,lines){
  lines.forEach(l=>addNote(title,l));
  openModal(`<h2>${title}</h2>${lines.map(l=>`<div class="clue">${l}</div>`).join('')}<div style="text-align:right;margin-top:12px"><button id="cl">닫기</button></div>`);
  $('#cl').onclick=closeModal;
}
function addNote(t,l){
  const txt=`<b>${t.replace(/^\S+\s/,'')}</b> — ${l.replace(/<br>/g,' ')}`;
  if(!S.notes.includes(txt)) S.notes.push(txt);
}
$('#notesBtn').onclick=()=>{
  openModal(`<h2>📒 수첩</h2>${S.notes.length?`<ol id="notesList">${S.notes.map(n=>`<li>${n}</li>`).join('')}</ol>`:'<p style="color:var(--dim)">아직 적은 단서가 없다.</p>'}<div style="text-align:right;margin-top:12px"><button id="cl">닫기</button></div>`);
  $('#cl').onclick=closeModal;
};
$('#muteBtn').onclick=()=>{ muted=!muted; if(master) master.gain.value=muted?0:.85; $('#muteBtn').textContent=muted?'🔇':'🔊'; };

/* ===================== 게임 로직 ===================== */
function giveItem(id){
  S.items.add(id); sfx.item();
  if(S.items.has('eye')&&S.items.has('body')){
    S.items.delete('eye'); S.items.delete('body'); S.items.add('doll');
    setTimeout(()=>{narrate('유리 눈을 인형 몸통에 끼워 넣었다. 인형이 나를 빤히 올려다본다. 눈동자가… 방금 움직인 것 같다.'); sfx.whisper&&0;},600);
  }
  renderInv();
}
function go(room){
  if(S.over) return;
  sfx.creak(); S.room=room; setHot(true); closeModal();
  if(room==='hall') narrate('차가운 현관 홀. 어딘가에서 규칙적인 시계 소리가 난다. 멈춰 있는 시계에서…');
  if(room==='kids') narrate('어린이방. 낡은 침대, 장난감, 벽에 가득한 낙서. 아이들 웃음소리가 벽 너머에서 메아리친다.');
  if(room==='cellar'){ narrate('지하실. 곰팡내와 쇠 냄새. 제단 위에 초 다섯 개가 놓여 있다. 바닥에 그려진 붉은 원이 마치 나를 기다린 것 같다.');
    if(!S.scared.has('cellar')){ S.scared.add('cellar'); setTimeout(()=>jumpscare(),2400); } }
}
function useDoor(room,key,lockMsg){
  if(S.items.has(key)){ go(room); } else { sfx.creak(); narrate(lockMsg); }
}
function exitDoor(){
  if(S.solved.has('name')) return win();
  narrate('출구는 쇠사슬로 단단히 잠겨 있다. 자물쇠 안쪽에서… 누군가 아이의 목소리로 속삭인다. “가지 마. 같이 있자.”');
}
function altar(){
  if(!S.solved.has('candles')) return openPuzzle('candles');
  if(S.items.has('doll')) return openPuzzle('name');
  if(S.solved.has('name')) return narrate('제단은 고요하다.');
  narrate('제단 위 빈자리. 무언가를 올려놓아야 할 것 같다. 아직 인형이 완성되지 않았다.');
}

function openPuzzle(id){
  const p=PZ[id];
  if(S.solved.has(id)) return clue(p.title,['이미 해결했다.']);
  if(p.req&&!S.items.has(p.req)){ sfx.creak(); narrate(p.lock); return; }
  let body='';
  if(p.type==='text') body=`<div class="row"><input type="text" id="ans" autocomplete="off" placeholder="입력"><button class="primary" id="go">확인</button></div>`;
  if(p.type==='seq'){
    const cls=p.notes?'note':('cb'+(p.round?' round':''));
    body=`<div class="row">${p.buttons.map(([k,v])=>p.notes?`<button class="note" data-k="${k}">${v}</button>`:`<button class="${cls}" data-k="${k}" style="background:${v}">${k}</button>`).join('')}</div>
      <div id="seqShow"></div><div class="row"><button id="clr">지우기</button><button class="primary" id="go">확인</button></div>`;
  }
  if(p.type==='diff') body=`<div class="diffwrap">${photoSVG(0)}${photoSVG(1)}</div><div id="seqShow" class="cen cap">찾은 개수: 0 / 5</div>`;
  openModal(`<h2>${p.title}</h2><p style="line-height:1.7">${p.intro}</p><b>🔐 ${p.prompt}</b><div style="margin:12px 0">${body}</div><div id="msg"></div><button id="hintBtn" disabled></button><div id="hint"></div><div style="text-align:right;margin-top:12px"><button id="cl">닫기</button></div>`);
  $('#cl').onclick=closeModal;
  const st={seq:[],found:new Set()};
  $('#hintBtn').onclick=()=>{ S.hints++; $('#hint').innerHTML=`<div class="clue">${p.hint}</div>`; };
  const upd=()=>{ const w=S.wrongs[id]||0,b=$('#hintBtn'); if(!b) return; if(w>=NEED_WRONG){b.disabled=false;b.textContent='💡 힌트 보기'} else {b.disabled=true;b.textContent=`💡 힌트 (오답 ${w}/${NEED_WRONG}회 — ${NEED_WRONG}번 틀리면 열려요)`} };
  upd();
  const fail=(line)=>{ wrong(id,line); upd(); $('#msg').className='bad'; $('#msg').textContent='❌ 틀렸다… 뒤에서 무언가 움직이는 기척이 난다.'; };
  if(p.type==='text'){
    $('#ans').focus(); $('#ans').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
    $('#go').onclick=()=>{ const v=$('#ans').value.trim().toLowerCase().replace(/\s+/g,''); if(p.answer.includes(v)) solved(id); else fail(); };
  }
  if(p.type==='seq'){
    const names={};
    document.querySelectorAll('#box [data-k]').forEach(b=>{ b.onclick=()=>{
      if(st.seq.length>=p.len) return; st.seq.push(b.dataset.k);
      if(p.notes) sfx.note(+b.dataset.k); else sfx.click();
      $('#seqShow').textContent=st.seq.map(k=>p.notes?p.buttons[+k][1]:'●').join(' ');
      if(!p.notes) $('#seqShow').innerHTML=st.seq.map(k=>`<span style="color:${p.buttons.find(x=>x[0]===k)[1]}">■</span>`).join(' ');
    }});
    $('#clr').onclick=()=>{st.seq=[];$('#seqShow').textContent='';};
    $('#go').onclick=()=>{ if(st.seq.join(',')===p.answer) solved(id); else { fail(); st.seq=[]; $('#seqShow').textContent=''; } };
  }
  if(p.type==='diff'){
    document.querySelectorAll('#box .photo').forEach(sv=>sv.addEventListener('click',e=>{
      const r=sv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*400, y=(e.clientY-r.top)/r.height*260;
      const idx=DZ.findIndex(z=>Math.hypot(x-z.x,y-z.y)<=z.r);
      if(idx<0){ fail('그건 같은데…'); return; }
      if(st.found.has(idx)) return;
      st.found.add(idx);
      document.querySelectorAll('#box .photo').forEach(s2=>s2.insertAdjacentHTML('beforeend',`<circle cx="${DZ[idx].x}" cy="${DZ[idx].y}" r="${DZ[idx].r}" fill="none" stroke="#e33" stroke-width="3"/>`));
      sfx.click(); $('#seqShow').textContent=`찾은 개수: ${st.found.size} / 5`;
      if(st.found.size===5) solved(id);
    }));
  }
}

function solved(id){
  const p=PZ[id]; S.solved.add(id); sfx.good();
  if(p.note) addNote(p.title,p.note);
  if(p.give) giveItem(p.give);
  if(id==='candles'||id==='name') setHot();
  setHot_keep();
  if(id==='name'){ closeModal(); return finalScene(); }
  openModal(`<div class="cen"><h2 class="ok">✅ 풀었다</h2><p style="line-height:1.8">${p.ok}</p><button class="primary" id="okb">계속한다</button></div>`);
  $('#okb').onclick=closeModal; narrate(p.ok.replace(/<[^>]+>/g,''));
}
function setHot_keep(){ if(S.room==='cellar') setHot(); }

function wrong(id,line){
  S.wrongs[id]=(S.wrongs[id]||0)+1; S.totalWrong++; S.fear=Math.min(MAX_FEAR,S.fear+1);
  sfx.bad(); updateFear();
  $('#box').classList.remove('shake'); void $('#box').offsetWidth; $('#box').classList.add('shake');
  if(S.fear===4||S.fear===7) setTimeout(jumpscare,600);
  if(S.fear>=MAX_FEAR) setTimeout(caught,900);
}

function jumpscare(){
  if(S.over) return;
  closeModal();
  sfx.scare();
  const f=$('#flash'); f.style.opacity=1; setTimeout(()=>f.style.opacity=0,120);
  const sc=$('#scare'); sc.innerHTML=SCARE_SVG; sc.classList.add('on');
  setTimeout(()=>sc.classList.remove('on'),650);
  setTimeout(()=>narrate('…방금, 분명히 얼굴이 보였다.'),800);
}

/* ===================== 틀린그림 ===================== */
const DZ=[{x:85,y:95,r:34},{x:200,y:62,r:30},{x:110,y:150,r:28},{x:335,y:135,r:38},{x:270,y:66,r:26}];
function photoSVG(v){
  let s=`<svg class="photo" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="260" fill="#c8b89a"/><rect y="200" width="400" height="60" fill="#8a7550"/>
    <rect x="40" y="40" width="90" height="110" fill="#6f87a0" stroke="#4a3a22" stroke-width="5"/>`;
  if(!v) s+=`<path d="M40 40 L85 40 Q70 95 85 150 L40 150Z" fill="#8a4b4b"/>`;
  s+=`<circle cx="200" cy="62" r="24" fill="#efe6cf" stroke="#4a3a22" stroke-width="4"/>`;
  s+= v? `<line x1="200" y1="62" x2="200" y2="44" stroke="#222" stroke-width="3"/><line x1="200" y1="62" x2="182" y2="62" stroke="#222" stroke-width="3"/>`
        : `<line x1="200" y1="62" x2="200" y2="44" stroke="#222" stroke-width="3"/><line x1="200" y1="62" x2="216" y2="62" stroke="#222" stroke-width="3"/>`;
  s+=`<rect x="60" y="160" width="160" height="60" fill="#6b5a46" stroke="#3a2c1c" stroke-width="3"/><rect x="66" y="152" width="60" height="16" rx="6" fill="#ddd0b3"/>`;
  if(!v) s+=`<circle cx="110" cy="146" r="9" fill="#a0724e"/><rect x="102" y="152" width="16" height="16" rx="4" fill="#8f5f3d"/>`;
  s+=`<rect x="300" y="60" width="70" height="150" fill="${v?'#1a120c':'#6e5338'}" stroke="#3a2a18" stroke-width="5"/>`;
  if(v) s+=`<ellipse cx="336" cy="105" rx="10" ry="12" fill="#ccc"/><rect x="326" y="115" width="20" height="60" rx="8" fill="#bbb"/><circle cx="333" cy="103" r="2" fill="#000"/><circle cx="340" cy="103" r="2" fill="#000"/>`;
  else s+=`<circle cx="312" cy="135" r="4" fill="#caa14a"/>`;
  s+=`<g transform="rotate(${v?14:0} 270 66)"><rect x="252" y="43" width="36" height="46" fill="#7a6040" stroke="#3a2a18" stroke-width="3"/><rect x="258" y="49" width="24" height="34" fill="#d6c7a3"/></g>`;
  s+=`<ellipse cx="200" cy="232" rx="70" ry="12" fill="#4a3a28" opacity=".6"/><rect x="0" y="0" width="400" height="260" fill="none" stroke="#2a1d10" stroke-width="8"/></svg>`;
  return s;
}

/* ===================== 엔딩 ===================== */
function finalScene(){
  S.over=true; clearInterval(S.timer);
  sfx.good();
  narrate('“…하윤.” 이름을 부르자 촛불이 한꺼번에 흔들렸다. 아주 작은 손이 인형을 안아 올린다.');
  setTimeout(()=>{ updateFearReset(); },1200);
  setTimeout(()=>{ S.over=false; S.solved.add('name'); narrate('소녀는 희미하게 웃고는 빛 속으로 사라졌다. 위층에서 쇠사슬이 풀리는 소리가 들린다. 이제 현관으로 나가자.'); setHot(); },4200);
}
function updateFearReset(){ S.fear=0; updateFear(); $('#ghost').style.opacity=0; }
function win(){
  S.over=true; clearInterval(S.timer); sfx.creak();
  const t=$('#timer').textContent;
  setTimeout(()=>{
    $('#end').style.display='flex';
    $('#endBody').innerHTML=`<h1 class="title" style="color:#f2e3c0;text-shadow:0 0 24px rgba(255,230,170,.6)">탈출</h1>
      <p style="line-height:1.9;max-width:520px;margin:0 auto 14px;color:#d8cbb8">문이 열리고 새벽빛이 쏟아져 들어온다.<br>등 뒤에서 아이의 웃음소리가 아주 멀리서, 평화롭게 들렸다.<br>선샤인 고아원의 마지막 아이는 이제 집에 갔다.</p>
      <p style="color:#c9a26a">걸린 시간 ${t} · 틀린 횟수 ${S.totalWrong}회 · 사용한 힌트 ${S.hints}회</p>
      <p style="color:#8a7d6d;font-size:13px">엔딩: 소녀의 이름을 불러 준 사람</p>
      <button class="primary" id="again" style="margin-top:12px;padding:11px 28px">다시 하기</button>`;
    $('#again').onclick=()=>location.reload();
  },800);
}
function caught(){
  if(S.over) return; S.over=true; clearInterval(S.timer); closeModal(); jumpscare();
  setTimeout(()=>{
    $('#end').style.display='flex';
    $('#endBody').innerHTML=`<h1 class="title">잡혔다</h1>
      <p style="line-height:1.9;max-width:520px;margin:0 auto 14px;color:#cbbda8">손전등이 꺼졌다.<br>어둠 속에서 작은 손이 내 손목을 잡는다.<br>“…이제 같이 놀자.”</p>
      <p style="color:#8a7d6d;font-size:13px">엔딩: 영원히 같이 노는 사람 (틀린 횟수 ${S.totalWrong}회)</p>
      <button class="primary" id="again" style="margin-top:12px;padding:11px 28px">다시 도전</button>`;
    $('#again').onclick=()=>location.reload();
  },1400);
}

/* ===================== 시작 ===================== */
function tick(){ const s=Math.floor((Date.now()-S.t0)/1000); $('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function moveLight(e){
  const r=stage.getBoundingClientRect(); const x=e.clientX-r.left;
  // 터치할 때는 손가락에 가리지 않도록 불빛을 손가락 위쪽에 띄운다
  const y=e.clientY-r.top-(e.pointerType==='touch'?64:0);
  stage.style.setProperty('--mx',x+'px'); stage.style.setProperty('--my',y+'px');
  $('#dark').style.setProperty('--mx',x+'px'); $('#dark').style.setProperty('--my',y+'px');
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
stage.addEventListener('pointermove',moveLight);
stage.addEventListener('pointerdown',moveLight);

$('#startBtn').onclick=()=>{
  $('#intro').style.display='none';
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  S.started=true; S.t0=Date.now(); S.timer=setInterval(tick,500);
  setHot(true); renderInv(); updateFear();
  const r=stage.getBoundingClientRect(); moveLight({clientX:r.left+r.width/2,clientY:r.top+r.height/2});
  narrate('현관문이 등 뒤에서 철컥, 잠겼다. 손전등 불빛 속에 먼지가 떠다닌다. 어딘가에서 아이 웃음소리가 났다 — 방금.');
  setTimeout(()=>narrate('출구를 열 방법을 찾자. 조사할 곳에 불빛을 비추고 눌러 보자.'),5500);
};
setHot(true); // 인트로 뒤 배경
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&AC&&AC.state==='suspended') AC.resume(); });
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
